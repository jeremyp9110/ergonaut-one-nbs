# Rôle central BLE (dongle)
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# Affichage
CONFIG_DISPLAY=y
CONFIG_ZMK_DISPLAY=y

# Rétroéclairage (PWM sur P1.04)
CONFIG_PWM=y
CONFIG_LED=y
CONFIG_LED_PWM=y
CONFIG_ZMK_BACKLIGHT=y

# Pas de capteur de luminosité APDS9960 câblé : luminosité fixe
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y
# Mémoire LVGL (pool privé pour lv_malloc)
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_LV_Z_MEM_POOL_SYS_HEAP=y
CONFIG_LV_Z_MEM_POOL_SIZE=16384
