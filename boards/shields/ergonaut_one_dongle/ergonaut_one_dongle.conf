# Rôle central BLE (dongle)
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# Affichage et Graphismes
CONFIG_DISPLAY=y
CONFIG_ZMK_DISPLAY=y
CONFIG_LVGL=y

# Rétroéclairage (PWM sur P1.04)
CONFIG_PWM=y
CONFIG_LED=y
CONFIG_LED_PWM=y
CONFIG_ZMK_BACKLIGHT=y

# Luminosité fixe (pas de capteur APDS9960)
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80

# Gestion de la mémoire pour LVGL (Adapté Zephyr v4.1)
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_LV_Z_MEM_POOL_SYS_HEAP=y
CONFIG_LV_Z_MEM_POOL_SIZE=24576
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
